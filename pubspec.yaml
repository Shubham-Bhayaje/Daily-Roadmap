name: daily_roadmap
description: Daily practice suggestions from roadmap.sh roadmaps
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  archive: ^4.5.2
  file_picker: ^11.0.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/decks/
